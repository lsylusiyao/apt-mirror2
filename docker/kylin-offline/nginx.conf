user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    etag on;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        root /var/www/kylin-mirror;

        location = /__health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Do not publish apt-mirror2 partial/state directories.
        location ~ (^|/)\. {
            deny all;
        }

        location / {
            autoindex on;
            try_files $uri $uri/ =404;
        }
    }
}

